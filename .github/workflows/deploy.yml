name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 1. Install Bower globally so we can fetch vendor dependencies
      - name: Install Bower
        run: npm install -g bower

      # 2. Download missing JS libraries into lib/ using bower.json
      - name: Install Frontend Dependencies
        run: bower install --allow-root

      # 3. Generate your dynamic config.js from content/images/
      - name: Generate Dynamic config.js
        run: node build-config.js

      # 4. Stage everything into a single publish folder
      - name: Stage Full Deployment Package
        run: |
          mkdir -p dist

          # Copy app files to root of dist
          cp -r app/* dist/

          # Copy freshly fetched lib dependencies and content assets
          cp -r lib dist/ || true
          cp -r content dist/ || true

          # Include generated config.js
          cp config.js dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
