name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate Dynamic config.js
        run: node build-config.js

      # Copy config.js directly into the app folder where index.html looks for it
      - name: Prepare Deployment Directory
        run: |
          cp config.js app/ || cp config.js htck/app/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Point publish_dir to the actual app folder containing index.html!
          # If your folder path is 'htck/app', change 'app' below to 'htck/app'
          publish_dir: ./htck/app
